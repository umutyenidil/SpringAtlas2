<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Atlas Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .header {
            background: #4F46E5;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .content {
            padding: 30px;
            color: #333333;
            line-height: 1.6;
        }

        .footer {
            background: #eeeeee;
            padding: 15px;
            text-align: center;
            font-size: 12px;
            color: #777777;
        }
    </style>
</head>
<body>
<div class="container" th:fragment="layout (content)">

    <div class="header">
        <h2>Atlas Project</h2>
    </div>

    <div class="content">
        <div th:replace="${content}"></div>
    </div>

    <div class="footer">
        <p>&copy; 2026 Atlas Inc. Tüm hakları saklıdır.</p>
        <p>Bu e-posta sistem tarafından otomatik gönderilmiştir.</p>
    </div>

</div>
</body>
</html>
